<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<script>
(function(){var m=location.pathname.match(/\/(ko|en|ja|zh-cn|zh-tw)\/[^/]+\.html$/i);document.write('<base href="' + (m ? '../' : './') + '">');})();
</script>
<title>커뮤니티 — FPP v2</title>
<meta name="description" content="FPP v2 커뮤니티 — 패치노트, 게시판, 이벤트" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1626'/%3E%3Cpath d='M32 12c-8 0-14 6-14 13 0 5 3 9 7 11v6l4-2 3 3 3-3 4 2v-6c4-2 7-6 7-11 0-7-6-13-14-13z' fill='%23f5b942'/%3E%3C/svg%3E" />
<script>
/* 테마 저장값(JSON 문자열)을 파싱해 정규화 — 따옴표 포함 값이 data-theme에 들어가 CSS 변수가 늦게 적용되던 문제 수정 */
(function(){try{var t=localStorage.getItem('fpp_theme');if(t){try{t=JSON.parse(t);}catch(e){}document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}}catch(e){}})();
</script>
<style>
/* 페이지 전환 시 흰 화면 깜빡임 방지 — CSS 로드 전에도 테마 배경 즉시 적용 */
html{background:#0a1626;color-scheme:dark}
html[data-theme="light"]{background:#eef3f8;color-scheme:light}
/* 페이지 전환 베일 — 스타일시트가 적용되는 즉시 빠르게 해제, 폴백은 .9초 후 강제 해제 */
.page-veil{position:fixed;inset:0;z-index:9999;pointer-events:none;background:#0a1626;opacity:1;transition:opacity .25s ease;animation:pageVeilFail .3s ease .9s forwards}
html[data-theme="light"] .page-veil{background:#eef3f8}
.page-veil.off{opacity:0}
@keyframes pageVeilFail{to{opacity:0;visibility:hidden}}
</style>
<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/Community.css" />
<script src="js/i18n.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/sdk.js"></script>
</head>
<body data-page="community">

<div id="pageVeil" class="page-veil" aria-hidden="true"></div>
<div class="ambient" aria-hidden="true"></div>

<header id="appHeader" class="app-header"></header>
<nav id="desktopNav" class="desk-nav" aria-label="주 메뉴"></nav>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="navDrawer" aria-label="전체 메뉴" aria-hidden="true"></aside>

<main id="view">
  <!-- ===== 커뮤니티 홈 ===== -->
  <section class="page" id="view-comhome">
    <div class="banner banner--page" aria-label="커뮤니티 배너">
      <div class="banner-fallback" aria-hidden="true"></div>
      <div class="banner-media" id="commBannerMedia"></div>
    </div>
    <div class="wrap">
      <div class="com-stack">
        <div class="box rv">
          <div class="box-head"><h2 class="box-title">패치노트</h2><button class="box-go" type="button" data-go="patch">바로가기</button></div>
          <div class="box-body" id="comPatchList"></div>
        </div>
        <div class="box rv">
          <div class="box-head"><h2 class="box-title">게시판</h2><button class="box-go" type="button" data-go="board">바로가기</button></div>
          <div class="box-body" id="comBoardList"></div>
        </div>
        <div class="box rv">
          <div class="box-head"><h2 class="box-title">이벤트</h2><button class="box-go" type="button" data-go="event">바로가기</button></div>
          <div class="box-body" id="comEventList"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 패치노트 ===== -->
  <section class="page" id="view-patch" hidden>
    <div class="banner banner--page" aria-label="패치노트 배너">
      <div class="banner-fallback" aria-hidden="true"></div>
      <div class="banner-media" id="patchBannerMedia"></div>
    </div>
    <div class="wrap">
      <div class="patch-layout">
        <div class="patch-content rv" id="patchContent"></div>
        <aside class="month-filter rv" id="monthFilter" aria-label="월별 필터">
          <h3 class="month-title">월별</h3>
          <select id="monthSelect" class="month-select" aria-label="월별 선택"></select>
          <div class="month-list" id="monthList"></div>
        </aside>
      </div>
    </div>
  </section>

  <!-- ===== 게시판 ===== -->
  <section class="page" id="view-board" hidden>
    <div class="banner banner--page" aria-label="게시판 배너">
      <div class="banner-fallback" aria-hidden="true"></div>
      <div class="banner-media" id="boardBannerMedia"></div>
    </div>
    <div class="wrap">
      <div class="write-toolbar rv">
        <button class="write-btn" id="boardWriteBtn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          글쓰기
        </button>
      </div>
      <div class="toolbar rv" id="boardToolbar">
        <div class="chip-row" id="boardCats" role="group" aria-label="게시판 카테고리">
          <button class="chip is-on" data-cat="all" type="button">전체</button>
          <button class="chip" data-cat="자유" type="button">자유</button>
          <button class="chip" data-cat="정보" type="button">정보</button>
          <button class="chip" data-cat="질문" type="button">질문</button>
          <button class="chip" data-cat="자랑" type="button">자랑</button>
        </div>
        <div class="toolbar-right">
          <div class="seg" role="group" aria-label="보기 방식">
            <button class="seg-btn" data-view="card" type="button">카드형</button>
            <button class="seg-btn is-on" data-view="list" type="button">목록형</button>
          </div>
          <select id="boardSort" aria-label="정렬">
            <option value="new">최근등록순</option>
            <option value="like">좋아요순</option>
            <option value="old">오래된순</option>
          </select>
        </div>
      </div>
      <div id="boardContent"></div>
    </div>
  </section>

  <!-- ===== 이벤트 ===== -->
  <section class="page" id="view-event" hidden>
    <div class="banner banner--page" aria-label="이벤트 배너">
      <div class="banner-fallback" aria-hidden="true"></div>
      <div class="banner-media" id="eventBannerMedia"></div>
    </div>
    <div class="wrap">
      <div class="toolbar rv" id="eventToolbar">
        <div class="chip-row" id="eventCats" role="group" aria-label="이벤트 상태">
          <button class="chip is-on" data-cat="all" type="button">전체</button>
          <button class="chip" data-cat="ing" type="button">진행중</button>
          <button class="chip" data-cat="end" type="button">종료됨</button>
        </div>
        <div class="toolbar-right">
          <div class="seg" role="group" aria-label="보기 방식">
            <button class="seg-btn is-on" data-view="card" type="button">카드형</button>
            <button class="seg-btn" data-view="list" type="button">목록형</button>
          </div>
          <select id="eventSort" aria-label="정렬">
            <option value="new">최근등록순</option>
            <option value="like">좋아요순</option>
            <option value="old">오래된순</option>
          </select>
        </div>
      </div>
      <div id="eventContent"></div>
    </div>
  </section>
</main>

<footer class="app-footer">
  <div class="wrap foot-in">
    <span class="foot-logo">FPP</span>
    <p>FPP v2 — 팬 커뮤니티 · 본 사이트는 비공식 팬 프로젝트입니다.</p>
    <p class="foot-sub">데이터는 기존 Firebase 프로젝트(fighting-path-patch)에서 실시간으로 불러옵니다.</p>
  </div>
</footer>

<nav id="bottomTabs" class="bottom-tabs" aria-label="하단 메뉴"></nav>

<div id="popupRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="js/Firebase.js"></script>
<script src="js/common.js"></script>
<script src="js/Community.js"></script>
</body>
</html>
